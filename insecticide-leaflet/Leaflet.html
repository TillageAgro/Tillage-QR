<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Leaflet</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; line-height: 1.6; }
    .container { max-width: 900px; margin: auto; }
    .batch-box { background: #e8f5e9; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .warning { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="product-name">Loading...</h1>
    
    <div class="batch-box">
      <strong>Batch Number:</strong> <span id="batch"></span><br><br>
      <strong>Manufacturing Date:</strong> <span id="mfg"></span><br>
      <strong>Expiry Date:</strong> <span id="exp"></span><br>
      <strong>GTIN:</strong> <span id="gtin"></span>
    </div>

    <h2>📋 Dosage Instructions</h2>
    <p id="dosage"></p>

    <h2>⚠️ Safety Information & Precautions</h2>
    <p id="safety"></p>

    <h2>📄 Full Leaflet</h2>
    <a id="pdf-link" href="#" target="_blank" style="font-size:18px;">Download Approved Leaflet (PDF)</a>

    <p><strong>Read Leaflet Before Use</strong> - कृषि उपयोग के लिए पैकेट पर छपी जानकारी अवश्य पढ़ें।</p>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
